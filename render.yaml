# Render Blueprint : serveur de test gratuit de Maquis Express.
# Base de données et photos : Supabase. Les secrets (sync: false) sont
# collés à la main dans Render, jamais écrits dans ce fichier.
services:
  - type: web
    name: maquis-express
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Maquis Express
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: TRUSTED_PROXIES
        value: "*"

      # Base PostgreSQL Supabase (Session pooler, compatible IPv4)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-eu-west-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.zkxejapcvsjxpbcetbqx
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log

      # Photos privées sur Supabase Storage (bucket « photos »)
      - key: PHOTOS_DISK
        value: supabase
      - key: SUPABASE_S3_ENDPOINT
        value: https://zkxejapcvsjxpbcetbqx.storage.supabase.co/storage/v1/s3
      - key: SUPABASE_S3_REGION
        value: eu-west-1
      - key: SUPABASE_S3_BUCKET
        value: photos
      - key: SUPABASE_S3_KEY
        sync: false
      - key: SUPABASE_S3_SECRET
        sync: false

      # Compte Super Admin et maquis de démonstration
      - key: SUPERADMIN_PHONE
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "false"
      - key: DEMO_PASSWORD
        sync: false
