name: maquis-express

x-app: &app-base
  build:
    context: .
    target: app
  image: maquis-express-app:latest
  env_file: .env.docker
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # PHP-FPM : exécute Laravel + Livewire, lance les migrations au démarrage
  app:
    <<: *app-base
    environment:
      RUN_MIGRATIONS: "true"

  # Worker des files d'attente (notifications WhatsApp/SMS, rapports...)
  queue:
    <<: *app-base
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      app:
        condition: service_started

  # Tâches planifiées (rappels d'abonnement, suspension, rapport du soir...)
  scheduler:
    <<: *app-base
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_started

  # Nginx : point d'entrée HTTP
  web:
    build:
      context: .
      target: web
    image: maquis-express-web:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage:/var/www/html/storage:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  storage:
  mysql-data:
  redis-data:
