<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B4D3C">
    <title>Pas de connexion — Maquis Express</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
            font-family: -apple-system, 'Segoe UI', Roboto, Inter, sans-serif; color: #10231D;
            background: linear-gradient(160deg, #0B4D3C, #062E24); }
        .box { background: #fff; border-radius: 22px; padding: 36px 28px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 30px 70px rgba(0,0,0,.3); }
        img { width: 64px; height: 64px; border-radius: 16px; }
        h1 { font-size: 22px; margin: 18px 0 10px; letter-spacing: -.02em; }
        p { color: #5B6B65; font-size: 15px; line-height: 1.6; margin: 0 0 22px; }
        ul { text-align: left; color: #5B6B65; font-size: 14px; line-height: 1.8; margin: 0 0 24px; padding-left: 20px; }
        button { width: 100%; background: #D2622A; color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <img src="/icons/icon-192.png" alt="">
        <h1>Pas de connexion internet</h1>
        <p>Maquis Express a besoin d'internet pour enregistrer les commandes et la caisse.</p>
        <ul>
            <li>Vérifiez que les données mobiles ou le Wi-Fi sont activés.</li>
            <li>Vérifiez qu'il vous reste du crédit internet.</li>
            <li>Rapprochez-vous de la box Wi-Fi.</li>
        </ul>
        <button onclick="location.reload()">Réessayer</button>
    </div>
    <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
